[project]
name = "jev-feishu"
version = "0.3.0"
description = "Local read-only Feishu companion for macOS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyobjc-framework-applicationservices>=12.2.2",
    "pyobjc-framework-cocoa>=12.2.2",
]

[project.scripts]
jev-feishu = "jev_feishu.app:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = []
